<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demistify JSX</title>

    <!-- Version that loads monaco and babel from CDN -->

    <!-- pre-built Monaco passed later to setMonacoModule -->
    <link rel="stylesheet" href="https://www.unpkg.com/@jsx6/editor-monaco@0.48.0/dist/index.css" />
    <script src="https://www.unpkg.com/@jsx6/editor-monaco@0.48.0/dist/index.js"></script>
    <script>
      monaco.setPreBuiltWorkerBase('https://www.unpkg.com/@jsx6/editor-monaco@0.48.0/dist', true)
    </script>

    <!-- pre-built Babel passed later to setBabelModule -->
    <script src="https://unpkg.com/@babel/standalone@7.18.13/babel.min.js"></script>

    <script type="module" crossorigin src="./assets/demistify.js"></script>
    <link rel="stylesheet" href="./assets/demistify.css" />
  </head>
  <body class="fxs1"></body>
</html>
