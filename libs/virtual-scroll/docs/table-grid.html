<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Scrolling - Table Grid with Sticky Header</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <script type="module" src="script-page3.js"></script>
  </head>

  <body>
    <nav>
      <a href="index.html">Home</a>
      <a href="offset-top.html">Offset Top</a>
      <a href="table-grid.html">Table + Sticky Header</a>
    </nav>

    <div id="app">
      <header>
        <h1>Table Grid Demo</h1>
        <p>Rows are stacked grid items — no absolute positioning — under a sticky header</p>
        <div>
          <button data-action="jump">Jump to #5000</button>
          <button data-action="top">Back to top</button>
        </div>
      </header>

      <main id="scroll-container" style="--item-height: 40px">
        <!-- sticky, never virtualized: the library does not know about it -->
        <div id="table-header" class="table-header">
          <span>#</span>
          <span>Product</span>
          <span class="cell-price">Price</span>
        </div>

        <div id="spacer"></div>

        <div id="list-items-container" class="table-rows">
          <!-- rows are injected and recycled here, all sharing one grid area -->
        </div>
      </main>

      <div id="stats">
        <span>Scroll Position: <span id="scroll-y">0</span>px</span>
        <span>Active Elements: <span id="element-count">0</span></span>
      </div>
    </div>
  </body>
</html>
